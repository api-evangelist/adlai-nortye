aid: adlai-nortye
name: Adlai Nortye
description: >-
  Adlai Nortye is a global clinical-stage biopharmaceutical company, headquartered in
  Hangzhou, China with US operations in New Jersey, developing differentiated
  immuno-oncology and precision-targeted cancer medicines. Its pipeline covers two
  therapeutic areas: precision RAS pathway targeted therapies — the oral pan-RAS(ON)
  inhibitor AN9025 and the CEACAM5-targeting antibody-drug conjugate AN4035 built on the
  company's proprietary RASiCA (RAS Inhibitor Conjugated Antibody) platform — and
  next-generation PD-1/L1 pathway modulating immunotherapies including AN8025, a
  multi-functional T-cell and antigen-presenting-cell modulating fusion protein, plus the
  oral EP4 antagonist AN0025 (palupiprant). The company is listed on Nasdaq under the
  ticker ANL. Adlai Nortye publishes no developer program, API, SDK or machine-readable
  contract of any kind.
